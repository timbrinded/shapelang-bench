openapi: 3.0.3
info:
  title: Minimal Library Circulation API
  version: 1.1.0
servers:
  - url: http://localhost:{port}/api
    variables:
      port:
        default: "3137"
paths:
  /health-check:
    get:
      responses:
        "200":
          description: Server is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /members:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberCreate"
      responses:
        "201":
          description: Member created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Invalid request.
        "409":
          description: Duplicate member name.
  /books:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookCreate"
      responses:
        "201":
          description: Book created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          description: Invalid request.
        "409":
          description: Duplicate ISBN.
  /books/{bookId}/copies:
    post:
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "201":
          description: Copy created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Copy"
        "404":
          description: Book missing.
  /loans:
    post:
      security:
        - Token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanCreate"
      responses:
        "201":
          description: Loan created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "400":
          description: Invalid request.
        "401":
          description: Missing or invalid token.
        "404":
          description: Book missing.
        "409":
          description: No copy available or duplicate active loan.
  /loans/{loanId}/return:
    post:
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/LoanId"
      responses:
        "200":
          description: Loan returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
        "401":
          description: Missing or invalid token.
        "403":
          description: Loan belongs to another member.
        "404":
          description: Loan missing.
        "409":
          description: Already returned.
  /books/{bookId}/holds:
    post:
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "201":
          description: Hold placed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hold"
        "401":
          description: Missing or invalid token.
        "404":
          description: Book missing.
        "409":
          description: Duplicate active hold.
  /members/me/summary:
    get:
      security:
        - Token: []
      responses:
        "200":
          description: Authenticated member summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSummary"
        "401":
          description: Missing or invalid token.
components:
  securitySchemes:
    Token:
      type: apiKey
      in: header
      name: Authorization
      description: Use the literal format `Token <token>`.
  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        type: string
    LoanId:
      name: loanId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Health:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    MemberCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required: [name]
    Member:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        token:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, token, createdAt]
    BookCreate:
      type: object
      properties:
        isbn:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
      required: [isbn, title]
    Book:
      type: object
      properties:
        id:
          type: string
        isbn:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, isbn, title, createdAt]
    Copy:
      type: object
      properties:
        id:
          type: string
        bookId:
          type: string
        status:
          type: string
          enum: [available, loaned]
      required: [id, bookId, status]
    LoanCreate:
      type: object
      properties:
        bookId:
          type: string
      required: [bookId]
    Loan:
      type: object
      properties:
        id:
          type: string
        bookId:
          type: string
        copyId:
          type: string
        memberId:
          type: string
        status:
          type: string
          enum: [active, returned]
        createdAt:
          type: string
          format: date-time
        returnedAt:
          type: string
          nullable: true
          format: date-time
      required: [id, bookId, copyId, memberId, status, createdAt]
    Hold:
      type: object
      properties:
        id:
          type: string
        bookId:
          type: string
        memberId:
          type: string
        status:
          type: string
          enum: [pending, fulfilled]
        createdAt:
          type: string
          format: date-time
      required: [id, bookId, memberId, status, createdAt]
    MemberSummary:
      type: object
      properties:
        memberId:
          type: string
        activeLoanCount:
          type: integer
        returnedLoanCount:
          type: integer
        holdCount:
          type: integer
        activeBookIds:
          type: array
          items:
            type: string
      required: [memberId, activeLoanCount, returnedLoanCount, holdCount, activeBookIds]
