openapi: 3.0.3
info:
  title: Minimal Warehouse Lot API
  version: 1.0.0
servers:
  - url: http://localhost:{port}/api
    variables:
      port:
        default: "3137"
paths:
  /health-check:
    get:
      responses:
        "200": { description: Server is healthy. }
  /items:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemCreate"
      responses:
        "201": { description: Item created. }
        "400": { description: Invalid request. }
        "409": { description: Duplicate SKU. }
  /items/{itemId}/lots:
    post:
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LotCreate"
      responses:
        "201": { description: Lot created. }
        "400": { description: Invalid request. }
        "404": { description: Item missing. }
        "409": { description: Duplicate lot code for item. }
  /shipments:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentCreate"
      responses:
        "201": { description: Shipment created. }
        "400": { description: Invalid request. }
        "404": { description: Item missing. }
        "409": { description: Insufficient stock or duplicate reference. }
  /shipments/{shipmentId}/cancel:
    post:
      parameters:
        - $ref: "#/components/parameters/ShipmentId"
      responses:
        "200": { description: Shipment canceled and allocations restored. }
        "404": { description: Shipment missing. }
        "409": { description: Shipment already canceled. }
  /items/{itemId}/availability:
    get:
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200": { description: Item availability summary. }
        "404": { description: Item missing. }
components:
  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    ShipmentId:
      name: shipmentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    ItemCreate:
      type: object
      properties:
        sku: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        reorderPoint: { type: integer, minimum: 0 }
      required: [sku, name, reorderPoint]
    LotCreate:
      type: object
      properties:
        lotCode: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1 }
        expiresAt: { type: string, format: date-time }
      required: [lotCode, quantity, expiresAt]
    ShipmentCreate:
      type: object
      properties:
        reference: { type: string, minLength: 1 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              sku: { type: string, minLength: 1 }
              quantity: { type: integer, minimum: 1 }
            required: [sku, quantity]
      required: [reference, lines]
