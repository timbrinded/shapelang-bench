openapi: 3.0.3
info:
  title: Minimal Entitlement Gate API
  version: 1.0.0
servers:
  - url: http://localhost:{port}/api
    variables:
      port:
        default: "3137"
paths:
  /health-check:
    get:
      responses:
        "200": { description: Server is healthy. }
  /accounts:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug: { type: string, minLength: 1 }
              required: [slug]
      responses:
        "201": { description: Account created. }
        "400": { description: Invalid request. }
        "409": { description: Duplicate slug. }
  /plans:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, minLength: 1 }
                monthlyQuota: { type: integer, minimum: 1 }
              required: [code, monthlyQuota]
      responses:
        "201": { description: Plan created. }
        "400": { description: Invalid request. }
        "409": { description: Duplicate code. }
  /subscriptions:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: string, minLength: 1 }
                planCode: { type: string, minLength: 1 }
                startsAt: { type: string, format: date-time }
              required: [accountId, planCode, startsAt]
      responses:
        "201": { description: Subscription created. }
        "400": { description: Invalid request. }
        "404": { description: Account or plan missing. }
        "409": { description: Account already has an active subscription. }
  /subscriptions/{subscriptionId}/cancel:
    post:
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200": { description: Subscription canceled. }
        "404": { description: Subscription missing. }
        "409": { description: Already canceled. }
  /usage-events:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: string, minLength: 1 }
                units: { type: integer, minimum: 1 }
                occurredAt: { type: string, format: date-time }
              required: [accountId, units, occurredAt]
      responses:
        "201": { description: Usage accepted. }
        "400": { description: Invalid request. }
        "404": { description: Account missing. }
        "409": { description: No active subscription or quota exceeded. }
  /accounts/{accountId}/entitlement:
    get:
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: true
          schema:
            type: string
      responses:
        "200": { description: Entitlement summary. }
        "400": { description: Invalid period. }
        "404": { description: Account missing. }
