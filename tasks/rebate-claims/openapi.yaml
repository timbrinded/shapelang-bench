openapi: 3.0.3
info:
  title: Minimal Rebate Claim API
  version: 1.0.0
servers:
  - url: http://localhost:{port}/api
    variables:
      port:
        default: "3137"
paths:
  /health-check:
    get:
      responses:
        "200": { description: Server is healthy. }
  /users:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, minLength: 1 }
              required: [username]
      responses:
        "201": { description: User created. }
        "400": { description: Invalid request. }
        "409": { description: Duplicate username. }
  /rebates:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, minLength: 1 }
                payoutCents: { type: integer, minimum: 1 }
                budgetCents: { type: integer, minimum: 1 }
                perUserLimit: { type: integer, minimum: 1 }
              required: [code, payoutCents, budgetCents, perUserLimit]
      responses:
        "201": { description: Rebate created. }
        "400": { description: Invalid request. }
        "409": { description: Duplicate code. }
  /claims:
    post:
      security:
        - Token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                externalId: { type: string, minLength: 1 }
                rebateCode: { type: string, minLength: 1 }
              required: [externalId, rebateCode]
      responses:
        "201": { description: Claim created. }
        "200": { description: Existing idempotent claim returned. }
        "400": { description: Invalid request. }
        "401": { description: Missing or invalid token. }
        "404": { description: Rebate missing. }
        "409": { description: Budget exceeded or per-user limit exceeded. }
  /claims/{claimId}/reverse:
    post:
      security:
        - Token: []
      parameters:
        - name: claimId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200": { description: Claim reversed. }
        "401": { description: Missing or invalid token. }
        "403": { description: Claim belongs to another user. }
        "404": { description: Claim missing. }
        "409": { description: Claim already reversed. }
  /rebates/{rebateId}/summary:
    get:
      parameters:
        - name: rebateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200": { description: Rebate summary. }
        "404": { description: Rebate missing. }
components:
  securitySchemes:
    Token:
      type: apiKey
      in: header
      name: Authorization
