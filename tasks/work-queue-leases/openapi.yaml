openapi: 3.0.3
info:
  title: Work Queue Lease API
  version: 1.0.0
servers:
  - url: http://localhost:{port}/api
    variables:
      port:
        default: "3137"
paths:
  /health-check:
    get:
      responses:
        "200": { description: Server is healthy. }
  /workers:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1 }
              required: [name]
      responses:
        "201": { description: Worker created. }
        "400": { description: Invalid request. }
        "409": { description: Duplicate worker name. }
  /queues:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueCreate"
      responses:
        "201": { description: Queue created. }
        "400": { description: Invalid request. }
        "409": { description: Duplicate queue name. }
  /jobs:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreate"
      responses:
        "201": { description: Job created. }
        "200": { description: Existing idempotent job returned. }
        "400": { description: Invalid request. }
        "404": { description: Queue missing. }
        "409": { description: Duplicate external id with different payload. }
  /queues/{queueId}/claim:
    post:
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/QueueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                now: { type: string, format: date-time }
              required: [now]
      responses:
        "200": { description: Job leased. }
        "204": { description: No ready job exists. }
        "401": { description: Missing or invalid token. }
        "404": { description: Queue missing. }
  /queues/{queueId}/reap:
    post:
      parameters:
        - $ref: "#/components/parameters/QueueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                now: { type: string, format: date-time }
              required: [now]
      responses:
        "200": { description: Expired leases requeued. }
        "400": { description: Invalid request. }
        "404": { description: Queue missing. }
  /jobs/{jobId}/complete:
    post:
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                result: { type: object, additionalProperties: true }
              required: [result]
      responses:
        "200": { description: Job completed. }
        "401": { description: Missing or invalid token. }
        "403": { description: Lease belongs to another worker. }
        "404": { description: Job missing. }
        "409": { description: Job is not actively leased. }
  /jobs/{jobId}/fail:
    post:
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                error: { type: string, minLength: 1 }
                retryAt: { type: string, format: date-time }
              required: [error, retryAt]
      responses:
        "200": { description: Job failed and was either requeued or dead-lettered. }
        "401": { description: Missing or invalid token. }
        "403": { description: Lease belongs to another worker. }
        "404": { description: Job missing. }
        "409": { description: Job is not actively leased. }
  /jobs/{jobId}/release:
    post:
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, minLength: 1 }
              required: [reason]
      responses:
        "200": { description: Job released back to the queue. }
        "401": { description: Missing or invalid token. }
        "403": { description: Lease belongs to another worker. }
        "404": { description: Job missing. }
        "409": { description: Job is not actively leased. }
  /queues/{queueId}/summary:
    get:
      parameters:
        - $ref: "#/components/parameters/QueueId"
        - name: now
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200": { description: Queue summary. }
        "400": { description: Invalid request. }
        "404": { description: Queue missing. }
components:
  securitySchemes:
    Token:
      type: apiKey
      in: header
      name: Authorization
  parameters:
    QueueId:
      name: queueId
      in: path
      required: true
      schema: { type: string }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
  schemas:
    QueueCreate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        maxAttempts: { type: integer, minimum: 1 }
        leaseSeconds: { type: integer, minimum: 1 }
      required: [name, maxAttempts, leaseSeconds]
    JobCreate:
      type: object
      properties:
        queueName: { type: string, minLength: 1 }
        externalId: { type: string, minLength: 1 }
        payload: { type: object, additionalProperties: true }
        priority: { type: integer, default: 0 }
        runAt: { type: string, format: date-time }
      required: [queueName, externalId, payload, priority, runAt]
