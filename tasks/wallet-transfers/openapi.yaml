openapi: 3.0.3
info:
  title: Minimal Wallet Transfers API
  version: 1.1.0
servers:
  - url: http://localhost:{port}/api
    variables:
      port:
        default: "3137"
paths:
  /health-check:
    get:
      responses:
        "200":
          description: Server is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /users:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request.
        "409":
          description: Duplicate username.
  /accounts:
    post:
      security:
        - Token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Invalid request.
        "401":
          description: Missing or invalid token.
  /accounts/{accountId}/deposits:
    post:
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositCreate"
      responses:
        "201":
          description: Deposit recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntry"
        "400":
          description: Invalid request.
        "401":
          description: Missing or invalid token.
        "403":
          description: Account belongs to another user.
        "404":
          description: Account missing.
  /transfers:
    post:
      security:
        - Token: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferCreate"
      responses:
        "201":
          description: Transfer created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "200":
          description: Existing idempotent transfer returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          description: Invalid request.
        "401":
          description: Missing or invalid token.
        "403":
          description: Source account belongs to another user.
        "404":
          description: Account missing.
        "409":
          description: Insufficient funds.
  /accounts/{accountId}:
    get:
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Account details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          description: Missing or invalid token.
        "403":
          description: Account belongs to another user.
        "404":
          description: Account missing.
  /accounts/{accountId}/statement:
    get:
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Account ledger entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerEntry"
        "401":
          description: Missing or invalid token.
        "403":
          description: Account belongs to another user.
        "404":
          description: Account missing.
  /users/me/summary:
    get:
      security:
        - Token: []
      responses:
        "200":
          description: Authenticated user wallet summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSummary"
        "401":
          description: Missing or invalid token.
components:
  securitySchemes:
    Token:
      type: apiKey
      in: header
      name: Authorization
      description: Use the literal format `Token <token>`.
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Health:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    UserCreate:
      type: object
      properties:
        username:
          type: string
          minLength: 1
      required: [username]
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        token:
          type: string
      required: [id, username, token]
    AccountCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
      required: [name]
    Account:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        balanceCents:
          type: integer
      required: [id, userId, name, balanceCents]
    DepositCreate:
      type: object
      properties:
        amountCents:
          type: integer
          minimum: 1
      required: [amountCents]
    TransferCreate:
      type: object
      properties:
        fromAccountId:
          type: string
        toAccountId:
          type: string
        amountCents:
          type: integer
          minimum: 1
      required: [fromAccountId, toAccountId, amountCents]
    Transfer:
      type: object
      properties:
        id:
          type: string
        fromAccountId:
          type: string
        toAccountId:
          type: string
        amountCents:
          type: integer
        idempotencyKey:
          type: string
      required: [id, fromAccountId, toAccountId, amountCents, idempotencyKey]
    LedgerEntry:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        transferId:
          type: string
          nullable: true
        type:
          type: string
          enum: [deposit, transfer_debit, transfer_credit]
        amountCents:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, accountId, type, amountCents, createdAt]
    UserSummary:
      type: object
      properties:
        userId:
          type: string
        accountCount:
          type: integer
        totalBalanceCents:
          type: integer
        ledgerEntryCount:
          type: integer
      required: [userId, accountCount, totalBalanceCents, ledgerEntryCount]
