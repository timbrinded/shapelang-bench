openapi: 3.0.3
info:
  title: Minimal Clinic Scheduling API
  version: 1.1.0
servers:
  - url: http://localhost:{port}/api
    variables:
      port:
        default: "3137"
paths:
  /health-check:
    get:
      responses:
        "200":
          description: Server is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /users:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request.
        "409":
          description: Duplicate username.
  /doctors:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorCreate"
      responses:
        "201":
          description: Doctor created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
        "400":
          description: Invalid request.
        "409":
          description: Duplicate doctor code.
  /doctors/{doctorId}/availability:
    post:
      parameters:
        - $ref: "#/components/parameters/DoctorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityCreate"
      responses:
        "201":
          description: Availability window created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        "400":
          description: Invalid request.
        "404":
          description: Doctor missing.
  /appointments:
    post:
      security:
        - Token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreate"
      responses:
        "201":
          description: Appointment booked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Invalid request.
        "401":
          description: Missing or invalid token.
        "404":
          description: Doctor missing.
        "409":
          description: Slot unavailable.
  /appointments/{appointmentId}/cancel:
    post:
      security:
        - Token: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          description: Appointment canceled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "401":
          description: Missing or invalid token.
        "403":
          description: Appointment belongs to another patient.
        "404":
          description: Appointment missing.
        "409":
          description: Already canceled.
  /doctors/{doctorId}/schedule:
    get:
      parameters:
        - $ref: "#/components/parameters/DoctorId"
      responses:
        "200":
          description: Doctor schedule summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorSchedule"
        "404":
          description: Doctor missing.
  /users/me/appointments:
    get:
      security:
        - Token: []
      responses:
        "200":
          description: Authenticated user's appointments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
        "401":
          description: Missing or invalid token.
components:
  securitySchemes:
    Token:
      type: apiKey
      in: header
      name: Authorization
      description: Use the literal format `Token <token>`.
  parameters:
    DoctorId:
      name: doctorId
      in: path
      required: true
      schema:
        type: string
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Health:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    UserCreate:
      type: object
      properties:
        username:
          type: string
          minLength: 1
      required: [username]
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        token:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, username, token, createdAt]
    DoctorCreate:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
      required: [code, name]
    Doctor:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, code, name, createdAt]
    AvailabilityCreate:
      type: object
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      required: [startsAt, endsAt]
    Availability:
      type: object
      properties:
        id:
          type: string
        doctorId:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      required: [id, doctorId, startsAt, endsAt]
    AppointmentCreate:
      type: object
      properties:
        doctorId:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
      required: [doctorId, startsAt, endsAt, reason]
    Appointment:
      type: object
      properties:
        id:
          type: string
        doctorId:
          type: string
        patientId:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        reason:
          type: string
        status:
          type: string
          enum: [booked, canceled]
        createdAt:
          type: string
          format: date-time
      required: [id, doctorId, patientId, startsAt, endsAt, reason, status, createdAt]
    DoctorSchedule:
      type: object
      properties:
        doctorId:
          type: string
        bookedCount:
          type: integer
        canceledCount:
          type: integer
        appointments:
          type: array
          description: IDs of currently booked appointments for this doctor.
          items:
            type: string
      required: [doctorId, bookedCount, canceledCount, appointments]
